name: Atualizar preços

on:
  schedule:
    - cron: "23 9 * * *"    # todo dia por volta das 06:23 (Brasília); minuto quebrado evita a fila da hora cheia
  workflow_dispatch:         # botão "Run workflow" para rodar na hora
  push:
    paths: ["data/links.xlsx"]   # roda também quando você sobe uma planilha nova

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Buscar preços no Mercado Livre
        run: python scripts/scrape.py
      - name: Testar geração do site
        run: python scripts/build.py
      - name: Salvar preços (o Cloudflare publica sozinho)
        run: |
          git config user.name "atualizador-precos"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw.json
          git diff --cached --quiet || (git commit -m "Atualiza preços $(date +%F)" && git push)
